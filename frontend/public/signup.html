<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Superstore Business Analytics Dashboard - User Account Registration">
  <title>Sign Up | Superstore Business Analytics Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Inline theme preloader to prevent flash of wrong theme -->
  <script>
    (function() {
      const saved = localStorage.getItem('superstore_theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body class="auth-page">

  <!-- AUTH TOP BAR -->
  <header class="auth-nav">
    <a href="/index.html" class="brand-badge" title="Return to Homepage">
      <div class="brand-logo">S</div>
      <span>Superstore Analytics</span>
    </a>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <!-- Theme Toggle Button -->
      <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Theme">
        <span class="theme-icon">
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
      </button>
      <a href="/index.html" class="btn btn-secondary btn-sm">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>Homepage</span>
      </a>
    </div>
  </header>

  <!-- AUTH CARD CONTAINER -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">S</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register to unlock full executive sales analytics access</p>
      </div>

      <!-- Feedback Alert Banner -->
      <div id="auth-alert" class="auth-alert" role="alert"></div>

      <!-- Sign Up Form -->
      <form id="signup-form" class="auth-form" novalidate>
        <!-- Full Name (Default: Ayush Raj, Editable) -->
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            name="fullName" 
            class="form-control" 
            value="Ayush Raj" 
            placeholder="Enter your full name" 
            required 
            autocomplete="name"
          >
          <span style="font-size: 0.725rem; color: var(--text-muted); margin-top: 0.15rem;">
            Default name provided; you may edit or customize this.
          </span>
        </div>

        <!-- Username (User creates their own) -->
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-control" 
            placeholder="Choose a unique username (min 3 chars)" 
            required 
            autocomplete="username"
          >
        </div>

        <!-- Password (User creates their own) -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Create a strong password (min 6 chars)" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" id="btn-toggle-password" title="Show/Hide password" aria-label="Toggle password visibility">
              <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="confirmPassword" 
              name="confirmPassword" 
              class="form-control" 
              placeholder="Re-enter password to confirm" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" id="btn-toggle-confirm" title="Show/Hide confirm password" aria-label="Toggle confirm password visibility">
              <svg class="eye-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Create Account Button -->
        <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
          <span>Create Account & Launch Dashboard</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <!-- Link to Login Page -->
      <div class="auth-footer">
        <span>Already have an account?</span>
        <a href="/login.html" style="font-weight: 600; margin-left: 0.35rem;">Log In</a>
      </div>
    </div>
  </main>

  <!-- Sign Up Logic & Theme Script -->
  <script>
    // Theme Management
    const themeBtn = document.getElementById('theme-toggle');

    function updateThemeUI() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const moon = document.querySelector('.icon-moon');
      const sun = document.querySelector('.icon-sun');
      if (moon && sun) {
        moon.style.display = isDark ? 'none' : 'block';
        sun.style.display = isDark ? 'block' : 'none';
      }
      if (themeBtn) {
        themeBtn.title = isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode';
      }
    }
    updateThemeUI();

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('superstore_theme', newTheme);
        updateThemeUI();
      });
    }

    // Password Toggles
    function setupToggle(btnId, inputId) {
      const btn = document.getElementById(btnId);
      const input = document.getElementById(inputId);
      if (btn && input) {
        btn.addEventListener('click', () => {
          const isPassword = input.getAttribute('type') === 'password';
          input.setAttribute('type', isPassword ? 'text' : 'password');
          const eyeShow = btn.querySelector('.eye-show');
          const eyeHide = btn.querySelector('.eye-hide');
          if (eyeShow && eyeHide) {
            eyeShow.style.display = isPassword ? 'none' : 'block';
            eyeHide.style.display = isPassword ? 'block' : 'none';
          }
        });
      }
    }

    setupToggle('btn-toggle-password', 'password');
    setupToggle('btn-toggle-confirm', 'confirmPassword');

    // Form Submission & Registration
    const signupForm = document.getElementById('signup-form');
    const alertBox = document.getElementById('auth-alert');
    const submitBtn = document.getElementById('btn-submit');

    function showAlert(msg, isError = true) {
      if (!alertBox) return;
      alertBox.textContent = msg;
      alertBox.className = isError ? 'auth-alert error' : 'auth-alert success';
      alertBox.style.display = 'block';
    }

    if (signupForm) {
      signupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!fullName) {
          showAlert('Please enter your full name.');
          return;
        }
        if (!username) {
          showAlert('Please choose a username.');
          return;
        }
        if (username.length < 3) {
          showAlert('Username must be at least 3 characters long.');
          return;
        }
        if (!password) {
          showAlert('Please enter a password.');
          return;
        }
        if (password.length < 6) {
          showAlert('Password must be at least 6 characters long.');
          return;
        }
        if (password !== confirmPassword) {
          showAlert('Passwords do not match. Please verify your confirmation password.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Creating secure account...</span>';

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, username, password, confirmPassword })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            showAlert(data.message || 'Registration failed. Please try another username.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Create Account & Launch Dashboard</span>';
            return;
          }

          showAlert('Account created successfully! Redirecting to dashboard...', false);

          setTimeout(() => {
            window.location.href = '/business%20dashboard.html';
          }, 700);
        } catch (err) {
          showAlert('Network error occurred. Please try again.');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Create Account & Launch Dashboard</span>';
        }
      });
    }
  </script>
</body>
</html>
